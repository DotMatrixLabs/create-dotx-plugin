name: Publish @dotmatrixlabs/create-dotx-plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Expected tag ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "=== npm config ==="
          npm config list
          echo "=== npm whoami ==="
          npm whoami --registry https://registry.npmjs.org 2>&1 || true
          echo "=== publishing ==="
          npm publish --access public --provenance --loglevel verbose
        continue-on-error: true

      - name: Show npm debug log on failure
        if: always()
        run: |
          LOG=$(ls /home/runner/.npm/_logs/*.log 2>/dev/null | tail -1)
          if [ -n "$LOG" ]; then cat "$LOG"; fi
